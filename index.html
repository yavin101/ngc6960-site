<style>
  /* Layout: one night-sky frame. The nebula photo fills the frame; the name sits low and left, the catalog line beneath it. */
  :root {
    --sky: #070b14;
    --sky-low: #0c1220;
    --ink: #eef1f6;
    --ink-soft: #a4adbd;
    --rule: #2a3346;
    --display: "Michroma", "Helvetica Neue", Arial, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--ink); font-family: var(--mono); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; display: block; object-fit: cover; object-position: 38% 30%; }
  .frame {
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: clamp(20px, 3vw, 32px);
    padding-block: clamp(24px, 5vw, 56px);
    padding-left: max(clamp(16px, 5vw, 64px), env(safe-area-inset-left, 0px));
    padding-right: max(clamp(16px, 5vw, 64px), env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, var(--sky) 0%, var(--sky) 22%, transparent 58%);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.125rem, 8.4vw, 7.5rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 span { color: var(--ink-soft); }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 32px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 0.8125rem;
    line-height: 1.6;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  footer > * { min-width: 0; margin: 0; }
</style>
